[package]
name = "pal-vm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "pal_vm"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "sena"
path = "src/sena.rs"
required-features = ["desktop"]

[[bin]]
name = "dump-pgd"
path = "src/dump_pgd.rs"
required-features = ["cli"]

[[bin]]
name = "dump-graphic"
path = "src/dump_graphic.rs"
required-features = ["cli"]

[[bin]]
name = "dump-pgd-info"
path = "src/dump_pgd_info.rs"
required-features = ["cli"]

[[bin]]
name = "dump-resource"
path = "src/dump_resource.rs"
required-features = ["cli"]

[features]
nfs = ["dep:game-network", "game-network/nfs", "pal-asset/nfs"]
smb = ["dep:game-network", "game-network/smb", "pal-asset/smb"]
default = ["desktop", "device-audio"]
cli = ["dep:clap", "dep:env_logger"]
desktop = ["cli", "dep:bytemuck", "dep:pollster", "dep:softbuffer", "dep:wgpu", "dep:winit"]
device-audio = ["kira/cpal"]
# Platform shells pull PCM from Kira through the C ABI instead of using CPAL.
host-audio = []

[dependencies]
game-network = { path = "../game-network", optional = true, default-features = false }
ab_glyph.workspace = true
anyhow.workspace = true
bytemuck = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
encoding_rs.workspace = true
env_logger = { workspace = true, optional = true }
log.workspace = true
kira.workspace = true
pal-asset.workspace = true
pal-script.workspace = true
na_mpeg2_decoder.workspace = true
png = "0.17"
jpeg-decoder = { version = "=0.3.2", default-features = false }
symphonia = { version = "=0.5.5", default-features = false, features = ["mp1", "mp2", "mp3"] }
sha2 = { version = "=0.10.9", default-features = false }
pollster = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
wmv-decoder.workspace = true
winit = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_EventNotificationService"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
ndk-context = "0.1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "console",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "ImageData",
    "KeyboardEvent",
    "MouseEvent",
    "Performance",
    "Window",
] }
web-time = "1.1"
