name: Build Artifacts

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  # Lets a build be re-triggered from the Actions tab or `gh workflow run`
  # without pushing a new commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-A static_mut_refs"
  SENA_CARGO_PKG: pal-vm
  SENA_BIN: sena
  SENA_RUST_LIB_NAME: pal_vm

jobs:
  meta:
    name: Read Sena version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check reviewed PAL ABI declarations
        run: |
          python3 reverse/abi/generate.py --check
          python3 reverse/evidence/generate_registered_dispatch.py --check

      - name: Read version from crates/pal-vm/Cargo.toml
        id: ver
        run: |
          VERSION="$(
            awk '
              /^\[package\]$/ { in_package = 1; next }
              /^\[/ && in_package { exit }
              in_package && /^version[[:space:]]*=/ {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' crates/pal-vm/Cargo.toml
          )"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  linux_x86_64:
    name: linux-x86_64 (ubuntu-22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcb1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev

      - name: Build (release)
        run: |
          cargo build --release -p "${SENA_CARGO_PKG}" --bin "${SENA_BIN}" --verbose

      - name: Package artifact
        run: |
          mkdir -p dist/linux
          test -f "target/release/${SENA_BIN}"
          tar -C "target/release" -czf "dist/linux/sena-linux-x86_64.tar.gz" "${SENA_BIN}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sena-linux-x86_64
          path: dist/linux/sena-linux-x86_64.tar.gz
          if-no-files-found: error

  linux_aarch64:
    name: linux-aarch64 (ubuntu-22.04-arm)
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcb1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev

      - name: Build (release)
        run: |
          cargo build --release -p "${SENA_CARGO_PKG}" --bin "${SENA_BIN}" --verbose

      - name: Package artifact
        run: |
          mkdir -p dist/linux
          test -f "target/release/${SENA_BIN}"
          tar -C "target/release" -czf "dist/linux/sena-linux-aarch64.tar.gz" "${SENA_BIN}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sena-linux-aarch64
          path: dist/linux/sena-linux-aarch64.tar.gz
          if-no-files-found: error

  wasm:
    name: wasm
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: |
          set -euo pipefail
          VERSION="$(
            awk '
              /^\[\[package\]\]$/ { in_package = 0; next }
              /^name[[:space:]]*=[[:space:]]*"wasm-bindgen"$/ { in_package = 1; next }
              in_package && /^version[[:space:]]*=/ {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.lock
          )"
          test -n "${VERSION}"
          cargo install -f wasm-bindgen-cli --version "${VERSION}"

      - name: Build wasm package
        run: |
          set -euo pipefail
          chmod +x platform/scripts/build_wasm.sh
          ./platform/scripts/build_wasm.sh

      - name: Verify wasm output
        run: |
          test -f dist/wasm/sena-wasm.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sena-wasm
          path: dist/wasm/sena-wasm.zip
          if-no-files-found: error

  macos:
    name: macos (dmg only)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install build tools
        run: |
          brew install xcodegen

      - name: Build macOS .app
        run: |
          chmod +x platform/scripts/package_macos_app.sh
          ./platform/scripts/package_macos_app.sh

      - name: Build macOS .dmg
        run: |
          chmod +x platform/scripts/package_macos_dmg.sh
          ./platform/scripts/package_macos_dmg.sh

      - name: Verify DMG output
        run: |
          test -f dist/macos/Sena.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sena-macos
          path: dist/macos/Sena.dmg
          if-no-files-found: error

  ios:
    name: ios (ipa only)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS Rust targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install build tools
        run: |
          brew install xcodegen

      - name: Build iOS artifacts
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          chmod +x platform/scripts/build_ios_xcframework.sh
          chmod +x platform/scripts/package_ios_altstore_ipa.sh
          ./platform/scripts/build_ios_xcframework.sh
          ./platform/scripts/package_ios_altstore_ipa.sh

      - name: Collect IPA only
        run: |
          set -euo pipefail
          mkdir -p dist/ios_ci

          IPA_PATH="$(
            {
              find dist -maxdepth 5 -type f -name 'SenaLauncher.ipa'
              find dist -maxdepth 5 -type f -name 'Sena.ipa'
              find platform/ios -type f -name '*.ipa'
            } | awk '!seen[$0]++' | head -n 1
          )"

          test -n "$IPA_PATH"
          cp -v "$IPA_PATH" dist/ios_ci/SenaLauncher.ipa
          test -f dist/ios_ci/SenaLauncher.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sena-ios
          path: dist/ios_ci/SenaLauncher.ipa
          if-no-files-found: error

  windows:
    name: windows (x64 + arm64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Add targets
        shell: cmd
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add aarch64-pc-windows-msvc

      - name: Build x64
        shell: cmd
        run: |
          call platform\scripts\build_windows_msvc.cmd x86_64

      - name: Build arm64
        shell: cmd
        run: |
          call platform\scripts\build_windows_msvc.cmd arm64

      - name: Collect Windows outputs
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows_ci | Out-Null
          Copy-Item "dist\windows\x86_64\sena.exe" "dist\windows_ci\sena.exe"
          Copy-Item "dist\windows\arm64\sena.exe" "dist\windows_ci\sena_arm64.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sena-windows
          path: |
            dist/windows_ci/sena.exe
            dist/windows_ci/sena_arm64.exe
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-22.04
    env:
      SIGNED_RELEASE: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # `android-actions/setup-android@v3` now fails on every runner: it runs
      # `sdkmanager --install "tools"`, and that package no longer exists in
      # the SDK repository ("Failed to find package 'tools'"). The Ubuntu
      # runners already ship a complete SDK, so use it directly instead.
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "${SDK}" || { echo "Android SDK not found at ${SDK}" >&2; exit 1; }

          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "${SDK}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          [[ -n "${SDKMANAGER}" ]] || { echo "sdkmanager not found under ${SDK}" >&2; exit 1; }
          echo "SDKMANAGER=${SDKMANAGER}" >> "$GITHUB_ENV"
          echo "Using sdkmanager: ${SDKMANAGER}"

      - name: Install Android components
        run: |
          set -euo pipefail

          "${SDKMANAGER}" --version
          "${SDKMANAGER}" --licenses < /dev/null || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;36.0.0" \
            "ndk;26.3.11579264"

          echo "Installed NDKs:"
          ls -la "${ANDROID_SDK_ROOT}/ndk" || true

      - name: Build Android APK
        env:
          VARIANT: release
          SENA_CI_DEBUG_SIGNING: ${{ env.SIGNED_RELEASE == 'true' && '0' || '1' }}
          ABIS: "arm64-v8a x86_64"
          ANDROID_PLATFORM: "28"
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/26.3.11579264"

          chmod +x platform/scripts/package_android_apk.sh
          ./platform/scripts/package_android_apk.sh

      - name: Collect APK only
        run: |
          set -euo pipefail
          mkdir -p dist/android_ci

          if [[ "$SIGNED_RELEASE" == 'true' ]]; then
            APK_PATH=platform/android/app/build/outputs/apk/release/app-release-unsigned.apk
          else
            APK_PATH=platform/android/app/build/outputs/apk/release/app-release.apk
          fi
          test -f "$APK_PATH"
          cp -v "$APK_PATH" dist/android_ci/app-release.apk
          test -f dist/android_ci/app-release.apk

      - name: Sign Android APK
        if: env.SIGNED_RELEASE == 'true'
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          umask 077
          : "${ANDROID_KEY_BASE64:?missing release keystore secret}"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/sena-release.p12"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
          bash platform/android/sign.sh dist/android_ci/app-release.apk dist/android_ci/app-release-signed.apk
          mv dist/android_ci/app-release-signed.apk dist/android_ci/app-release.apk

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/android_ci/app-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sena-android
          path: dist/android_ci/app-release.apk
          if-no-files-found: error

  console_tests:
    name: Console core and input tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the core without desktop dependencies
        run: cargo test -p pal-vm --lib --no-default-features --features host-audio
      - name: Test console input and letterboxing
        run: |
          cc -std=c11 -Wall -Wextra -Werror platform/common/test_console.c -lm -o /tmp/sena-console-test
          /tmp/sena-console-test

  consoles:
    name: ${{ matrix.platform }} homebrew
    runs-on: ubuntu-24.04
    needs: [meta, console_tests]
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: switch
            package: sena.nro
            # siglus_rs switch-build:f7740a0a96c7d24a
            image: ghcr.io/xmoezzz/siglus_rs/switch-build@sha256:bb3f47af6951a4770171fe1c8e5a508ddb233d09a17bd6c8650c2e928ab504f3
            sdk_key: bb3f47af6951a477
            toolchain: nightly-2026-01-20
          - platform: vita
            package: sena.vpk
            # siglus_rs vita-build:6f6be2c078140b09
            image: ghcr.io/xmoezzz/siglus_rs/vita-build@sha256:f9e3eaa24d74fa48dd514fbc86b19a13d7fdf88db96e920a303b050ec8402a85
            sdk_key: f9e3eaa24d74fa48
            toolchain: nightly-2026-09-18
    container:
      image: ${{ matrix.image }}
    env:
      SENA_CONSOLE_TOOLCHAIN: ${{ matrix.toolchain }}
      SENA_SWITCH_TOOLCHAIN: ${{ matrix.toolchain }}
      SENA_VITA_TOOLCHAIN: ${{ matrix.toolchain }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging helpers
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends cmake python3 patch

      - name: Check prepared SDK and Rust toolchain
        run: |
          set -euo pipefail
          rustup run "$SENA_CONSOLE_TOOLCHAIN" rustc --version
          case "${{ matrix.platform }}" in
            switch)
              command -v aarch64-none-elf-gcc
              command -v uam
              test -f "$DEVKITPRO/libnx/lib/libdeko3d.a"
              ;;
            vita)
              command -v arm-vita-eabi-gcc
              test -f "$VITASDK/arm-vita-eabi/lib/libvita2d.a"
              ;;
          esac

      - name: Cache console dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target/${{ matrix.platform }}-native
          key: console-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.sdk_key }}-${{ matrix.toolchain }}-${{ hashFiles(format('platform/{0}/build_*.sh', matrix.platform)) }}-${{ hashFiles('Cargo.lock', 'platform/**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            console-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.sdk_key }}-${{ matrix.toolchain }}-${{ hashFiles(format('platform/{0}/build_*.sh', matrix.platform)) }}-${{ hashFiles('Cargo.lock', 'platform/**/Cargo.lock') }}-
            console-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.sdk_key }}-${{ matrix.toolchain }}-${{ hashFiles(format('platform/{0}/build_*.sh', matrix.platform)) }}-

      - name: Build native package
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.platform }}"
          bash platform/${{ matrix.platform }}/build_${{ matrix.platform }}.sh 2>&1 | tee "dist/${{ matrix.platform }}/build.log"

      - name: Verify native package and write checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 platform/scripts/verify_console_package.py \
            "${{ matrix.platform }}" "dist/${{ matrix.platform }}/${{ matrix.package }}"
          cd "dist/${{ matrix.platform }}"
          sha256sum "${{ matrix.package }}" > "${{ matrix.package }}.sha256"

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: sena-${{ matrix.platform }}
          path: |
            dist/${{ matrix.platform }}/${{ matrix.package }}
            dist/${{ matrix.platform }}/${{ matrix.package }}.sha256
          if-no-files-found: error

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sena-${{ matrix.platform }}-build-log
          path: dist/${{ matrix.platform }}/build.log
          if-no-files-found: warn

  prerelease:
    name: Publish GitHub Pre-release (non-tag pushes only)
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: [meta, linux_x86_64, linux_aarch64, wasm, macos, ios, windows, android, consoles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: sena-prerelease
      cancel-in-progress: true

    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Compute short SHA
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Recreate pre-release from scratch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view pre-release >/dev/null 2>&1; then
            gh release delete pre-release --cleanup-tag -y
          fi

          NOTES="$(cat <<EOF
          Rolling pre-release from non-tag push

          Version: v${{ needs.meta.outputs.version }}
          Commit: ${{ github.sha }}
          Short SHA: ${{ steps.vars.outputs.short_sha }}
          EOF
          )"

          gh release create pre-release \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "sena v${{ needs.meta.outputs.version }} pre-release (${{ steps.vars.outputs.short_sha }})" \
            --notes "$NOTES"

          gh release upload pre-release \
            _artifacts/sena-linux-x86_64/sena-linux-x86_64.tar.gz \
            _artifacts/sena-linux-aarch64/sena-linux-aarch64.tar.gz \
            _artifacts/sena-wasm/sena-wasm.zip \
            _artifacts/sena-macos/Sena.dmg \
            _artifacts/sena-ios/SenaLauncher.ipa \
            _artifacts/sena-windows/sena.exe \
            _artifacts/sena-windows/sena_arm64.exe \
            _artifacts/sena-android/app-release.apk \
            _artifacts/sena-switch/sena.nro \
            _artifacts/sena-switch/sena.nro.sha256 \
            _artifacts/sena-vita/sena.vpk \
            _artifacts/sena-vita/sena.vpk.sha256

  release:
    name: Publish GitHub Release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [meta, linux_x86_64, linux_aarch64, wasm, macos, ios, windows, android, consoles]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: List artifacts
        run: |
          find _artifacts -maxdepth 6 -type f -print

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "sena v${{ needs.meta.outputs.version }}"
          files: |
            _artifacts/**/*
          fail_on_unmatched_files: true
